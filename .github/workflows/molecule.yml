---
name: Molecule

# This workflow will act as an includable module
# it will be called by the scheduled workflow and the test workflow
on: workflow_call

jobs:
  molecule:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Run ansible-lint
      uses: ansible/ansible-lint@main
      with:
        args: "--exclude vagrant/"

    - name: YAML lint
      run: |
        python -m pip install --upgrade pip
        pip install --user yamllint
        yamllint --version
        yamllint .

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Molecule (latest)
      run: |
        python -m pip install --upgrade pip
        pip install ansible-core molecule "molecule-plugins[docker]"
        molecule --version

    - name: Molecule
      run: molecule test --all -d docker
      env:
        ANSIBLE_FORCE_COLOR: '1'

...
